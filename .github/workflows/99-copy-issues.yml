name: 99 - Copy issues from starter repo

# Copies all open issues carrying this course's label (vars.QXX) from the
# starter repo, along with their open sub-issues, and re-creates the
# parent/sub-issue links between the copies in this repo.
#
# For copying a single issue, see workflow 98.

env:
    GH_TOKEN: ${{ github.token }}
    STARTER_REPO: ucsb-cs156/proj-dining
    TAG: ${{ vars.QXX }}

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  copyIssues:
    name: Copy issues and sub-issues
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy issues
        run: |
          numbers=$(gh issue list --repo "$STARTER_REPO" -s open -l "$TAG" --limit 1000 --json number --jq '.[].number')
          echo "Issues to copy: $numbers"
          if [ -z "$numbers" ]; then
            echo "No open issues labeled '$TAG' found in $STARTER_REPO" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2086
          bash .github/scripts/copy-issue-tree.sh $numbers
